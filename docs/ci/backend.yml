name: Backend contract and platform
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock -r backend/requirements-engine.txt
      - run: python -m pytest
      - run: python scripts/export_openapi.py
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python scripts/smoke.py --url http://localhost:8080
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
