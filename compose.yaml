services:
  api:
    build: .
    env_file: .env
    environment:
      QOR_DATA_DIR: /data
      DATABASE_PATH: /data/qor.sqlite3
    volumes:
      - qor_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
  web:
    image: caddy:2.10.2-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  qor_data:
  caddy_data:
  caddy_config:
